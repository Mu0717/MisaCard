<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>发卡系统 - 移动端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      .container {
        max-width: 100%;
        padding: 1rem;
      }

      .card {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 1.5rem;
        margin-bottom: 1rem;
      }

      .btn {
        width: 100%;
        padding: 1rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.2s;
        border: none;
        cursor: pointer;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:active {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .btn-success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
      }

      .btn-success:active {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .btn-purple {
        background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
        color: white;
      }

      .btn-purple:active {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .btn-danger {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: white;
      }

      .btn-danger:active {
        transform: scale(0.98);
        opacity: 0.9;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .input-field {
        width: 100%;
        padding: 1rem;
        border: 2px solid #e5e7eb;
        border-radius: 0.75rem;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      .input-field:focus {
        outline: none;
        border-color: #667eea;
      }

      .tab-btn {
        flex: 1;
        padding: 0.75rem;
        background: #f3f4f6;
        color: #6b7280;
        border: none;
        font-weight: 600;
        transition: all 0.2s;
        cursor: pointer;
      }

      .tab-btn.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .tab-btn:first-child {
        border-radius: 0.75rem 0 0 0.75rem;
      }

      .tab-btn:last-child {
        border-radius: 0 0.75rem 0.75rem 0;
      }

      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .badge-success {
        background-color: #d1fae5;
        color: #065f46;
      }

      .badge-error {
        background-color: #fee2e2;
        color: #991b1b;
      }

      .badge-warning {
        background-color: #fef3c7;
        color: #92400e;
      }

      .loading {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9999;
        align-items: center;
        justify-content: center;
      }

      .loading.active {
        display: flex;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #f3f4f6;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .fade-in {
        animation: fadeIn 0.3s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-card {
        background: #f9fafb;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-top: 1rem;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        padding: 0.75rem 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .info-row:last-child {
        border-bottom: none;
      }

      .info-label {
        color: #6b7280;
        font-size: 0.875rem;
      }

      .info-value {
        color: #111827;
        font-weight: 600;
        font-size: 0.875rem;
        text-align: right;
        word-break: break-all;
      }

      .header {
        background: white;
        padding: 1rem;
        border-radius: 1rem;
        margin-bottom: 1rem;
        text-align: center;
      }

      .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .alert {
        padding: 1rem;
        border-radius: 0.75rem;
        margin-bottom: 1rem;
      }

      .alert-info {
        background: #dbeafe;
        border: 1px solid #3b82f6;
        color: #1e40af;
      }

      .alert-success {
        background: #d1fae5;
        border: 1px solid #10b981;
        color: #065f46;
      }

      .alert-error {
        background: #fee2e2;
        border: 1px solid #ef4444;
        color: #991b1b;
      }

      .transaction-item {
        background: white;
        border-radius: 0.5rem;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        border: 1px solid #e5e7eb;
      }

      .transaction-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }

      .transaction-merchant {
        font-weight: 600;
        color: #111827;
        font-size: 0.875rem;
      }

      .transaction-amount {
        font-weight: 700;
        font-size: 1rem;
      }

      .transaction-amount.positive {
        color: #10b981;
      }

      .transaction-amount.negative {
        color: #ef4444;
      }

      .transaction-details {
        font-size: 0.75rem;
        color: #6b7280;
      }

      textarea {
        font-family: "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <!-- Loading -->
    <div id="loading" class="loading">
      <div
        style="
          background: white;
          border-radius: 1rem;
          padding: 2rem;
          text-align: center;
        "
      >
        <div class="spinner" style="margin: 0 auto 1rem"></div>
        <p style="color: #6b7280; font-weight: 600">加载中...</p>
      </div>
    </div>

    <!-- Copy Modal -->
    <div id="copyModal" class="loading">
      <div
        class="fade-in"
        style="
          background: white;
          border-radius: 1rem;
          padding: 1.5rem;
          width: 90%;
          max-width: 400px;
          position: relative;
        "
      >
        <h3
          style="
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #111827;
            text-align: center;
          "
        >
          📋 复制信息
        </h3>
        <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 0.5rem">
          请点击下方按钮进行复制
        </p>
        <textarea
          id="copyContent"
          class="input-field"
          rows="8"
          readonly
          style="
            margin-bottom: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
          "
          onclick="this.select()"
        ></textarea>
        <div style="display: flex; gap: 0.75rem">
          <button
            class="btn"
            onclick="closeCopyModal()"
            style="background: #f3f4f6; color: #374151; flex: 1"
          >
            关闭
          </button>
          <button
            class="btn btn-primary"
            onclick="doCopyCallback()"
            style="flex: 1"
          >
            确认复制
          </button>
        </div>
      </div>
    </div>

    <!-- Login Page -->
    <div id="loginPage" class="container" style="display: block">
      <div class="header">
        <h1>🎴 发卡系统</h1>
        <p style="color: #6b7280; font-size: 0.875rem; margin-top: 0.5rem">
          移动端管理
        </p>
      </div>

      <div class="card">
        <h2
          style="
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #111827;
          "
        >
          登录
        </h2>
        <form onsubmit="handleLogin(event)">
          <label
            style="
              display: block;
              font-weight: 600;
              color: #374151;
              margin-bottom: 0.5rem;
              font-size: 0.875rem;
            "
          >
            账号
          </label>
          <input
            type="text"
            id="loginUsername"
            class="input-field"
            placeholder="请输入账号"
            style="margin-bottom: 1rem"
            required
          />
          <label
            style="
              display: block;
              font-weight: 600;
              color: #374151;
              margin-bottom: 0.5rem;
              font-size: 0.875rem;
            "
          >
            密码
          </label>
          <input
            type="password"
            id="loginPassword"
            class="input-field"
            placeholder="请输入密码"
            style="margin-bottom: 1rem"
            required
          />
          <div
            id="loginError"
            class="alert alert-error"
            style="display: none; margin-bottom: 1rem"
          ></div>
          <button type="submit" class="btn btn-primary">🔐 登录</button>
        </form>
      </div>

      <div
        class="card"
        style="
          background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
          border: 2px solid #3b82f6;
        "
      >
        <div style="text-align: center">
          <h3
            style="
              font-weight: 700;
              color: #1e40af;
              margin-bottom: 0.5rem;
              font-size: 0.875rem;
            "
          >
            💡 访客模式
          </h3>
          <p style="color: #1e3a8a; font-size: 0.875rem; margin-bottom: 1rem">
            无需登录即可使用查询激活功能
          </p>
          <button
            onclick="enterGuestMode()"
            class="btn btn-success"
            style="
              background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            "
          >
            👤 访客模式
          </button>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="container" style="display: none">
      <!-- Header -->
      <div class="header">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div>
            <h1>🎴 发卡系统</h1>
            <p
              style="color: #6b7280; font-size: 0.875rem; margin-top: 0.5rem"
              id="userInfo"
            >
              移动端查询激活
            </p>
          </div>
          <button
            id="logoutBtn"
            onclick="handleLogout()"
            style="
              display: none;
              padding: 0.5rem 1rem;
              background: #ef4444;
              color: white;
              border: none;
              border-radius: 0.5rem;
              font-weight: 600;
              font-size: 0.75rem;
            "
          >
            退出
          </button>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="card" style="padding: 0.5rem">
        <div style="display: flex; gap: 0; flex-wrap: wrap">
          <button
            class="tab-btn active"
            onclick="switchTab('single')"
            id="tab-single"
            style="flex: 1 1 50%"
          >
            单张激活
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('batch')"
            id="tab-batch"
            style="flex: 1 1 50%"
          >
            批量激活
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('query')"
            id="tab-query"
            style="flex: 1 1 50%; border-radius: 0 0 0 0.75rem"
          >
            卡号查询
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('delete')"
            id="tab-delete"
            style="flex: 1 1 50%; border-radius: 0 0 0.75rem 0"
          >
            删除卡密
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('cards')"
            id="tab-cards"
            style="display: none; flex: 1 1 50%; border-radius: 0 0 0.75rem 0"
          >
            卡片列表
          </button>
        </div>
      </div>

      <!-- Single Card Activation -->
      <div id="content-single" class="tab-content">
        <div class="card">
          <h2
            style="
              font-size: 1.25rem;
              font-weight: 700;
              margin-bottom: 1rem;
              color: #111827;
            "
          >
            单张卡片激活
          </h2>
          <div class="alert alert-info" style="font-size: 0.875rem">
            <strong>💡 提示：</strong>输入卡密后自动查询并激活卡片
          </div>
          <label
            style="
              display: block;
              font-weight: 600;
              color: #374151;
              margin-bottom: 0.5rem;
              font-size: 0.875rem;
            "
          >
            卡密
          </label>
          <input
            type="text"
            id="singleCardId"
            class="input-field"
            placeholder="请输入卡密 (例如: mio-xxxxx)"
            style="margin-bottom: 1rem"
          />
          <button class="btn btn-primary" onclick="activateSingleCard()">
            🚀 查询并激活
          </button>
        </div>

        <!-- Single Card Result -->
        <div id="singleResult"></div>
      </div>

      <!-- Batch Activation -->
      <div id="content-batch" class="tab-content" style="display: none">
        <div class="card">
          <h2
            style="
              font-size: 1.25rem;
              font-weight: 700;
              margin-bottom: 1rem;
              color: #111827;
            "
          >
            批量卡片激活
          </h2>
          <div class="alert alert-info" style="font-size: 0.875rem">
            <strong>💡 说明：</strong>
            <ul style="margin-top: 0.5rem; padding-left: 1.25rem">
              <li>每行输入一个卡密</li>
              <li>自动并发处理，速度快</li>
              <li>失败卡片会自动重试</li>
            </ul>
          </div>
          <label
            style="
              display: block;
              font-weight: 600;
              color: #374151;
              margin-bottom: 0.5rem;
              font-size: 0.875rem;
            "
          >
            批量卡密（每行一个）
          </label>
          <textarea
            id="batchCardIds"
            class="input-field"
            rows="8"
            placeholder="请输入卡密，每行一个&#10;&#10;示例：&#10;mio-xxxxx-xxxxx-xxxxx&#10;mio-yyyyy-yyyyy-yyyyy&#10;mio-zzzzz-zzzzz-zzzzz"
            style="margin-bottom: 1rem; resize: vertical"
          ></textarea>
          <button class="btn btn-success" onclick="activateBatchCards()">
            ⚡ 批量激活
          </button>
        </div>

        <!-- Batch Result -->
        <div id="batchResult"></div>
      </div>

      <!-- Card Number Query -->
      <div id="content-query" class="tab-content" style="display: none">
        <div class="card">
          <h2
            style="
              font-size: 1.25rem;
              font-weight: 700;
              margin-bottom: 1rem;
              color: #111827;
            "
          >
            卡号查询
          </h2>
          <div class="alert alert-info" style="font-size: 0.875rem">
            <strong>💡 说明：</strong>
            <ul style="margin-top: 0.5rem; padding-left: 1.25rem">
              <li>通过卡号查询交易明细</li>
              <li>查看余额和消费记录</li>
              <li>适用于已激活的卡片</li>
            </ul>
          </div>
          <label
            style="
              display: block;
              font-weight: 600;
              color: #374151;
              margin-bottom: 0.5rem;
              font-size: 0.875rem;
            "
          >
            卡号
          </label>
          <input
            type="text"
            id="cardNumber"
            class="input-field"
            placeholder="请输入卡号 (例如: 5123456789012345)"
            style="margin-bottom: 1rem"
          />
          <button class="btn btn-purple" onclick="queryByCardNumber()">
            🔍 查询交易明细
          </button>
        </div>

        <!-- Query Result -->
        <div id="queryResult"></div>
      </div>

      <!-- Delete Redeemed Card -->
      <div id="content-delete" class="tab-content" style="display: none">
        <div class="card">
          <h2
            style="
              font-size: 1.25rem;
              font-weight: 700;
              margin-bottom: 1rem;
              color: #111827;
            "
          >
            删除已激活卡密
          </h2>
          <div class="alert alert-error" style="font-size: 0.875rem">
            <strong>⚠️ 注意：</strong>此操作会删除远程激活记录，执行后无法撤销，请确认卡密无误。
          </div>
          <label
            style="
              display: block;
              font-weight: 600;
              color: #374151;
              margin-bottom: 0.5rem;
              font-size: 0.875rem;
            "
          >
            已激活卡密
          </label>
          <input
            type="text"
            id="deleteCardCode"
            class="input-field"
            placeholder="请输入要删除的已激活卡密"
            style="margin-bottom: 1rem"
          />
          <button id="deleteCardBtn" class="btn btn-danger" onclick="deleteRedeemedCard()">
            删除已激活卡密
          </button>
        </div>

        <div id="deleteCardResult"></div>
      </div>

      <!-- Card List -->
      <div id="content-cards" class="tab-content" style="display: none">
        <div class="card">
          <h2
            style="
              font-size: 1.25rem;
              font-weight: 700;
              margin-bottom: 1rem;
              color: #111827;
            "
          >
            卡片列表
          </h2>

          <!-- Filters -->
          <div style="margin-bottom: 1rem">
            <label
              style="
                display: block;
                font-weight: 600;
                color: #374151;
                margin-bottom: 0.5rem;
                font-size: 0.875rem;
              "
            >
              搜索
            </label>
            <input
              type="text"
              id="cardSearch"
              class="input-field"
              placeholder="搜索卡密或卡号"
              style="margin-bottom: 0.75rem"
              oninput="loadCardList()"
            />

            <label
              style="
                display: block;
                font-weight: 600;
                color: #374151;
                margin-bottom: 0.5rem;
                font-size: 0.875rem;
              "
            >
              状态筛选
            </label>
            <select
              id="cardStatusFilter"
              class="input-field"
              style="margin-bottom: 0.75rem"
              onchange="loadCardList()"
            >
              <option value="">全部状态</option>
              <option value="active">已激活</option>
              <option value="inactive">未激活</option>
              <option value="expired">已过期</option>
            </select>

            <label
              style="
                display: block;
                font-weight: 600;
                color: #374151;
                margin-bottom: 0.5rem;
                font-size: 0.875rem;
              "
            >
              售卖状态
            </label>
            <select
              id="cardSoldFilter"
              class="input-field"
              style="margin-bottom: 0.75rem"
              onchange="loadCardList()"
            >
              <option value="">全部</option>
              <option value="sold">已售卖</option>
              <option value="unsold">未售卖</option>
            </select>

            <label
              style="
                display: block;
                font-weight: 600;
                color: #374151;
                margin-bottom: 0.5rem;
                font-size: 0.875rem;
              "
            >
              额度筛选
            </label>
            <input
              type="number"
              id="limitFilter"
              class="input-field"
              placeholder="筛选额度 (如: 1, 2, 5)"
              step="0.01"
              min="0"
              style="margin-bottom: 0.75rem"
              oninput="loadCardList()"
            />
          </div>

          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 0.75rem;
            "
          >
            <span style="font-size: 0.875rem; color: #6b7280">
              共
              <span id="cardCount" style="font-weight: 600; color: #111827"
                >0</span
              >
              张卡片
            </span>
            <button
              onclick="loadCardList()"
              style="
                padding: 0.5rem 1rem;
                background: #667eea;
                color: white;
                border: none;
                border-radius: 0.5rem;
                font-weight: 600;
                font-size: 0.75rem;
              "
            >
              🔄 刷新
            </button>
          </div>

          <!-- 批量操作栏 -->
          <div
            style="
              display: flex;
              gap: 0.5rem;
              align-items: center;
              margin-bottom: 1rem;
              padding: 0.75rem;
              background: #f9fafb;
              border-radius: 0.5rem;
            "
          >
            <label
              style="
                display: flex;
                align-items: center;
                gap: 0.5rem;
                cursor: pointer;
                flex: 1;
              "
            >
              <input
                type="checkbox"
                id="selectAllCards"
                onchange="toggleSelectAll()"
                style="width: 1.25rem; height: 1.25rem; cursor: pointer"
              />
              <span
                style="font-size: 0.875rem; font-weight: 600; color: #374151"
              >
                全选 (<span id="selectedCount">0</span>)
              </span>
            </label>
            <button
              id="batchCopyBtn"
              onclick="batchCopyCardIds()"
              disabled
              style="
                padding: 0.5rem 1rem;
                background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
                color: white;
                border: none;
                border-radius: 0.5rem;
                font-weight: 600;
                font-size: 0.75rem;
                opacity: 0.5;
                cursor: not-allowed;
              "
            >
              📋 复制卡密
            </button>
            <button
              id="batchMarkSoldBtn"
              onclick="batchMarkAsSold()"
              disabled
              style="
                padding: 0.5rem 1rem;
                background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
                color: white;
                border: none;
                border-radius: 0.5rem;
                font-weight: 600;
                font-size: 0.75rem;
                opacity: 0.5;
                cursor: not-allowed;
              "
            >
              ✅ 标记售卖
            </button>
          </div>
        </div>

        <!-- Card List Container -->
        <div id="cardListContainer"></div>
      </div>

      <!-- Footer -->
    </div>

    <script>
      // ==================== Authentication ====================
      const AuthManager = {
        getToken() {
          return localStorage.getItem("access_token");
        },
        setToken(token) {
          localStorage.setItem("access_token", token);
        },
        clearToken() {
          localStorage.removeItem("access_token");
        },
        isAuthenticated() {
          return !!this.getToken();
        },
        setGuestMode(enabled) {
          localStorage.setItem("guest_mode", enabled ? "true" : "false");
        },
        isGuestMode() {
          return localStorage.getItem("guest_mode") === "true";
        },
        clearGuestMode() {
          localStorage.removeItem("guest_mode");
        },
      };

      // ==================== Login & Logout ====================
      async function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value.trim();
        const errorDiv = document.getElementById("loginError");

        if (!username || !password) {
          errorDiv.textContent = "请输入账号和密码";
          errorDiv.style.display = "block";
          return;
        }

        showLoading();
        errorDiv.style.display = "none";

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            AuthManager.setToken(data.access_token);
            AuthManager.clearGuestMode();
            showMainApp(username);
            showToast("登录成功！", "success");
          } else {
            errorDiv.textContent = data.detail || data.message || "登录失败";
            errorDiv.style.display = "block";
          }
        } catch (error) {
          errorDiv.textContent = "网络错误: " + error.message;
          errorDiv.style.display = "block";
        } finally {
          hideLoading();
        }
      }

      function enterGuestMode() {
        AuthManager.setGuestMode(true);
        showMainApp(null);
        showToast("已进入访客模式", "info");
      }

      function handleLogout() {
        if (confirm("确定要退出登录吗？")) {
          AuthManager.clearToken();
          AuthManager.clearGuestMode();
          document.getElementById("loginPage").style.display = "block";
          document.getElementById("mainApp").style.display = "none";
          document.getElementById("loginUsername").value = "";
          document.getElementById("loginPassword").value = "";
          showToast("已退出登录", "info");
        }
      }

      function showMainApp(username) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("mainApp").style.display = "block";

        const isGuest = AuthManager.isGuestMode();
        const userInfo = document.getElementById("userInfo");
        const logoutBtn = document.getElementById("logoutBtn");
        const cardsTab = document.getElementById("tab-cards");

        if (isGuest) {
          userInfo.textContent = "访客模式 - 仅查询激活";
          logoutBtn.style.display = "block";
          cardsTab.style.display = "none";
        } else {
          userInfo.textContent = `欢迎, ${username || "管理员"}`;
          logoutBtn.style.display = "block";
          cardsTab.style.display = "block";
        }
      }

      // ==================== Tab Switching ====================
      function switchTab(tab) {
        // Update tab buttons
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        document.getElementById("tab-" + tab).classList.add("active");

        // Update content
        document.querySelectorAll(".tab-content").forEach((content) => {
          content.style.display = "none";
        });
        document.getElementById("content-" + tab).style.display = "block";

        // Load data for specific tabs
        if (tab === "cards") {
          loadCardList();
        }
      }

      // ==================== Loading ====================
      function showLoading() {
        document.getElementById("loading").classList.add("active");
      }

      function hideLoading() {
        document.getElementById("loading").classList.remove("active");
      }

      // ==================== Toast ====================
      function showToast(message, type = "info") {
        const toast = document.createElement("div");
        const bgColor =
          type === "success"
            ? "#10b981"
            : type === "error"
            ? "#ef4444"
            : "#3b82f6";
        toast.style.cssText = `
                position: fixed;
                top: 1rem;
                left: 1rem;
                right: 1rem;
                background: ${bgColor};
                color: white;
                padding: 1rem;
                border-radius: 0.75rem;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                animation: fadeIn 0.3s ease-in;
            `;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(-20px)";
          toast.style.transition = "all 0.3s ease";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // ==================== Card ID Tooltip ====================
      let tooltipTimeout;
      let currentTooltip = null;

      function showCardIdTooltip(event, cardId) {
        event.preventDefault();

        // 长按500ms后显示提示
        tooltipTimeout = setTimeout(() => {
          // 移除已存在的提示
          if (currentTooltip) {
            currentTooltip.remove();
          }

          // 创建新提示
          const tooltip = document.createElement("div");
          tooltip.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
            z-index: 10001;
            max-width: 90%;
            word-break: break-all;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.2s ease-in;
          `;
          tooltip.textContent = cardId;
          document.body.appendChild(tooltip);
          currentTooltip = tooltip;

          // 3秒后自动隐藏
          setTimeout(() => {
            if (currentTooltip === tooltip) {
              hideCardIdTooltip();
            }
          }, 3000);
        }, 500);
      }

      function hideCardIdTooltip() {
        // 清除定时器
        if (tooltipTimeout) {
          clearTimeout(tooltipTimeout);
          tooltipTimeout = null;
        }

        // 移除提示
        if (currentTooltip) {
          currentTooltip.style.opacity = "0";
          currentTooltip.style.transition = "opacity 0.2s ease";
          setTimeout(() => {
            if (currentTooltip) {
              currentTooltip.remove();
              currentTooltip = null;
            }
          }, 200);
        }
      }

      // ==================== Single Card Activation ====================
      async function activateSingleCard() {
        const cardId = document.getElementById("singleCardId").value.trim();

        if (!cardId) {
          showToast("请输入卡密", "error");
          return;
        }

        showLoading();
        try {
          const response = await fetch(`/api/cards/${cardId}/activate`, {
            method: "POST",
          });
          const data = await response.json();

          if (response.ok && data.success) {
            displaySingleResult(data.card_data);
            showToast("激活成功！", "success");
          } else {
            displayError(
              data.detail || data.message || "激活失败",
              "singleResult"
            );
            showToast(data.detail || "激活失败", "error");
          }
        } catch (error) {
          displayError("网络错误: " + error.message, "singleResult");
          showToast("网络错误", "error");
        } finally {
          hideLoading();
        }
      }

      function displaySingleResult(card) {
        const resultDiv = document.getElementById("singleResult");
        resultDiv.innerHTML = `
                <div class="card fade-in">
                    <h3 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 1rem; color: #111827;">
                        ✅ 卡片信息
                    </h3>
                    <div class="result-card">
                        <div class="info-row">
                            <span class="info-label">卡密</span>
                            <span class="info-value">${card.card_id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">卡号</span>
                            <span class="info-value">${
                              card.card_number || "未激活"
                            }</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">CVC</span>
                            <span class="info-value">${
                              card.card_cvc || "未激活"
                            }</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">有效期</span>
                            <span class="info-value">${
                              card.card_exp_date || "未激活"
                            }</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">额度</span>
                            <span class="info-value">$${card.card_limit}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">状态</span>
                            <span class="info-value">${getStatusBadge(
                              card.status
                            )}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">售卖状态</span>
                            <span class="info-value">${getSoldBadge(
                              card.is_sold || false
                            )}</span>
                        </div>
                        ${
                          card.exp_date
                            ? `
                        <div class="info-row">
                            <span class="info-label">过期时间</span>
                            <span class="info-value">${formatDate(
                              card.exp_date
                            )}</span>
                        </div>
                        `
                            : ""
                        }
                        ${
                          card.billing_address
                            ? `
                        <div class="info-row" style="border-bottom: none; padding-bottom: 0;">
                            <span class="info-label">账单地址</span>
                        </div>
                        <div style="padding: 0.75rem 0 0.75rem 0;">
                            <div style="background: #f0fdf4; border: 1px solid #86efac; border-radius: 0.5rem; padding: 0.75rem; position: relative;">
                                <p style="color: #166534; font-size: 0.875rem; font-family: 'Courier New', monospace; word-break: break-all; margin: 0;" id="billing-addr-${card.card_id}">
                                    ${card.billing_address}
                                </p>
                            </div>
                        </div>
                        `
                            : ""
                        }
                    </div>
                    ${
                      card.card_number
                        ? `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem;">
                        <button class="btn btn-primary" onclick="copyCardInfo('${card.card_id}')" style="margin: 0; padding: 0.75rem; font-size: 0.875rem;">
                            📋 复制完整信息
                        </button>
                        <button class="btn btn-purple" onclick="viewTransactions('${card.card_id}')" style="margin: 0; padding: 0.75rem; font-size: 0.875rem;">

      // ==================== Batch Activation ====================
      async function activateBatchCards() {
        const textarea = document.getElementById("batchCardIds");
        const content = textarea.value.trim();

        if (!content) {
          showToast("请输入卡密", "error");
          return;
        }

        const cardIds = content
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line.length > 0);

        if (cardIds.length === 0) {
          showToast("未找到有效的卡密", "error");
          return;
        }

        const concurrency = 5;
        const maxRetries = 3;

        showLoading();
        const resultDiv = document.getElementById("batchResult");
        resultDiv.innerHTML = `
                <div class="card fade-in">
                    <h3 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 1rem; color: #111827;">
                        ⚡ 批量激活进度
                    </h3>
                    <div style="background: #f3f4f6; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.875rem;">
                            <span style="color: #6b7280;">总数: ${cardIds.length}</span>
                            <span style="color: #10b981; font-weight: 600;">成功: <span id="batchSuccess">0</span></span>
                            <span style="color: #ef4444; font-weight: 600;">失败: <span id="batchFailed">0</span></span>
                        </div>
                        <div style="width: 100%; height: 0.5rem; background: #e5e7eb; border-radius: 9999px; overflow: hidden;">
                            <div id="batchProgress" style="width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #059669); transition: width 0.3s;"></div>
                        </div>
                    </div>
                    <div id="batchLog" style="max-height: 300px; overflow-y: auto; font-size: 0.75rem; font-family: 'Courier New', monospace; background: #f9fafb; border-radius: 0.5rem; padding: 0.75rem;"></div>
                </div>
            `;

        try {
          const response = await fetch("/api/cards/batch/activate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              card_ids: cardIds,
              concurrency: concurrency,
              max_retries: maxRetries,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "批量激活请求失败");
          }

          // Update stats
          document.getElementById("batchSuccess").textContent =
            data.data.success_count;
          document.getElementById("batchFailed").textContent =
            data.data.failed_count;
          document.getElementById("batchProgress").style.width = "100%";

          // Display logs
          const logDiv = document.getElementById("batchLog");
          let logHtml = `<div style="color: #10b981; font-weight: 600; margin-bottom: 0.5rem;">✅ 批量激活完成！</div>`;
          logHtml += `<div style="margin-bottom: 0.75rem; color: #6b7280;">总数: ${data.data.total} | 成功: ${data.data.success_count} | 失败: ${data.data.failed_count}</div>`;

          if (data.data.success && data.data.success.length > 0) {
            logHtml += `<div style="color: #10b981; font-weight: 600; margin-top: 0.75rem; margin-bottom: 0.5rem;">成功激活:</div>`;
            data.data.success.forEach((item) => {
              const retryText =
                item.retry_count > 0 ? ` (重试${item.retry_count}次)` : "";
              const addressText = item.billing_address
                ? ` [账单地址: ${item.billing_address}]`
                : "";
              logHtml += `<div style="color: #059669; margin-bottom: 0.25rem;">✓ ${item.card_id}${addressText}${retryText}</div>`;
            });
          }

          if (data.data.failed && data.data.failed.length > 0) {
            logHtml += `<div style="color: #ef4444; font-weight: 600; margin-top: 0.75rem; margin-bottom: 0.5rem;">失败:</div>`;
            data.data.failed.forEach((item) => {
              const retryText =
                item.retry_count > 0 ? ` (已重试${item.retry_count}次)` : "";
              logHtml += `<div style="color: #dc2626; margin-bottom: 0.25rem;">✗ ${item.card_id}: ${item.message}${retryText}</div>`;
            });
          }

          logDiv.innerHTML = logHtml;

          showToast(
            `批量激活完成！成功: ${data.data.success_count}, 失败: ${data.data.failed_count}`,
            data.data.failed_count === 0 ? "success" : "info"
          );

          if (data.data.failed_count === 0) {
            textarea.value = "";
          }
        } catch (error) {
          const logDiv = document.getElementById("batchLog");
          logDiv.innerHTML = `<div style="color: #ef4444; font-weight: 600;">❌ 批量激活失败: ${error.message}</div>`;
          showToast("批量激活失败: " + error.message, "error");
        } finally {
          hideLoading();
        }
      }

      // ==================== Delete Redeemed Card ====================
      async function deleteRedeemedCard() {
        const input = document.getElementById("deleteCardCode");
        const button = document.getElementById("deleteCardBtn");
        const resultDiv = document.getElementById("deleteCardResult");
        const code = input.value.trim();

        if (!code) {
          showToast("请输入要删除的已激活卡密", "error");
          input.focus();
          return;
        }

        if (!confirm(`确定要删除已激活卡密“${code}”吗？\n\n此操作无法撤销。`)) {
          return;
        }

        const originalButtonText = button.textContent;
        button.disabled = true;
        button.textContent = "正在删除...";
        resultDiv.innerHTML = "";
        showLoading();

        try {
          const response = await fetch("/api/redeem/delete", {
            method: "POST",
            headers: {
              Accept: "application/json, text/plain, */*",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ code }),
            credentials: "include",
          });

          const responseText = await response.text();
          let data = null;
          if (responseText) {
            try {
              data = JSON.parse(responseText);
            } catch (_) {
              data = responseText;
            }
          }

          const message =
            (data && typeof data === "object" && (data.message || data.detail || data.msg)) ||
            (typeof data === "string" && data) ||
            (response.ok ? "删除成功" : `删除失败（HTTP ${response.status}）`);

          if (!response.ok || (data && typeof data === "object" && data.success === false)) {
            throw new Error(message);
          }

          resultDiv.innerHTML = `
            <div class="card fade-in">
              <div class="alert" style="margin: 0; background: #d1fae5; color: #065f46;">
                <strong>✅ 删除成功</strong>
                <p id="deleteSuccessMessage" style="margin-top: 0.5rem;"></p>
              </div>
            </div>`;
          document.getElementById("deleteSuccessMessage").textContent = message;
          input.value = "";
          showToast("已删除该激活卡密", "success");
        } catch (error) {
          resultDiv.innerHTML = `
            <div class="card fade-in">
              <div class="alert alert-error" style="margin: 0;">
                <strong>❌ 删除失败</strong>
                <p id="deleteErrorMessage" style="margin-top: 0.5rem;"></p>
              </div>
            </div>`;
          document.getElementById("deleteErrorMessage").textContent = error.message;
          showToast("删除失败: " + error.message, "error");
        } finally {
          hideLoading();
          button.disabled = false;
          button.textContent = originalButtonText;
        }
      }

      // ==================== Card Number Query ====================
      async function queryByCardNumber() {
        const cardNumber = document.getElementById("cardNumber").value.trim();

        if (!cardNumber) {
          showToast("请输入卡号", "error");
          return;
        }

        showLoading();
        const resultDiv = document.getElementById("queryResult");

        try {
          const response = await fetch(
            `/api/cards/query-by-card-number/${cardNumber}`,
            {
              method: "POST",
            }
          );

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.detail || "查询失败");
          }

          const data = await response.json();
          const cardInfo = data.data;

          let html = `
                    <div class="card fade-in">
                        <h3 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 1rem; color: #111827;">
                            📊 交易明细
                        </h3>
                        <div class="result-card" style="background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border: 1px solid #3b82f6;">
                            <div class="info-row">
                                <span class="info-label">卡号</span>
                                <span class="info-value">${
                                  cardInfo.card_number || cardNumber
                                }</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">状态</span>
                                <span class="info-value">${getStatusBadge(
                                  cardInfo.status || "N/A"
                                )}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">余额</span>
                                <span class="info-value" style="color: #10b981; font-size: 1.125rem;">$${
                                  cardInfo.available !== undefined
                                    ? cardInfo.available.toFixed(2)
                                    : "N/A"
                                }</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">已用</span>
                                <span class="info-value" style="color: #3b82f6; font-size: 1.125rem;">$${
                                  cardInfo.pending !== undefined
                                    ? cardInfo.pending.toFixed(2)
                                    : "N/A"
                                }</span>
                            </div>
                        </div>
                `;

          if (cardInfo.transactions && cardInfo.transactions.length > 0) {
            html += `
                        <h4 style="font-size: 1rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #111827;">
                            💳 交易记录 (${cardInfo.transactions.length} 笔)
                        </h4>
                    `;

            cardInfo.transactions.forEach((tx, index) => {
              const isNegative = tx.amount < 0;
              html += `
                            <div class="transaction-item">
                                <div class="transaction-header">
                                    <span class="transaction-merchant">#${
                                      index + 1
                                    } ${
                tx.merchant || tx.bank_description || "未知商户"
              }</span>
                                    <span class="transaction-amount ${
                                      isNegative ? "negative" : "positive"
                                    }">
                                        ${tx.amount}
                                    </span>
                                </div>
                                <div class="transaction-details">
                                    ${
                                      tx.date
                                        ? `<div>时间: ${formatDate(
                                            tx.date
                                          )}</div>`
                                        : ""
                                    }
                                    ${
                                      tx.status
                                        ? `<div>状态: ${tx.status}</div>`
                                        : ""
                                    }
                                    ${
                                      tx.reason_for_failure
                                        ? `<div style="color: #ef4444;">失败原因: ${tx.reason_for_failure}</div>`
                                        : ""
                                    }
                                </div>
                            </div>
                        `;
            });
          } else {
            html += `
                        <div style="text-align: center; padding: 2rem; color: #6b7280;">
                            <svg style="width: 3rem; height: 3rem; margin: 0 auto 0.5rem; opacity: 0.5;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <p style="font-weight: 600;">暂无交易记录</p>
                        </div>
                    `;
          }

          html += `</div>`;
          resultDiv.innerHTML = html;
          showToast("查询成功", "success");
        } catch (error) {
          displayError("查询失败: " + error.message, "queryResult");
          showToast("查询失败: " + error.message, "error");
        } finally {
          hideLoading();
        }
      }

      // ==================== View Transactions ====================
      async function viewTransactions(cardId) {
        const transDiv = document.getElementById(`transactions-${cardId}`);
        transDiv.innerHTML = `
                <div style="text-align: center; padding: 1rem; color: #6b7280;">

      function copyText(elementId) {
        const element = document.getElementById(elementId);
        if (!element) {
          showToast("复制失败: 元素不存在", "error");
          return;
        }

        const text = element.textContent.trim();
        // 直接尝试复制，如果是从点击事件触发应该没问题
        manualCopy(text);
      }

      function manualCopy(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => {
              showToast("已复制到剪贴板", "success");
            })
            .catch(() => {
              fallbackCopy(text);
            });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;

        // iOS 兼容性设置
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        textArea.setAttribute("readonly", "");

        document.body.appendChild(textArea);

        // 选择文本 (iOS 兼容)
        const range = document.createRange();
        range.selectNodeContents(textArea);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        textArea.setSelectionRange(0, 999999);

        try {
          const successful = document.execCommand("copy");
          if (successful) {
            showToast("已复制到剪贴板", "success");
          } else {
            showToast("复制失败，请手动复制", "error");
          }
        } catch (err) {
          showToast("复制失败", "error");
        } finally {
          document.body.removeChild(textArea);
        }
      }

      // ==================== Copy Modal ====================
      function showCopyModal(text) {
        document.getElementById("copyContent").value = text;
        document.getElementById("copyModal").classList.add("active");
        // 自动聚焦
        setTimeout(() => {
          document.getElementById("copyContent").select();
        }, 100);
      }

      function closeCopyModal() {
        document.getElementById("copyModal").classList.remove("active");
      }

      function doCopyCallback() {
        const text = document.getElementById("copyContent").value;
        manualCopy(text);
        closeCopyModal();
      }

      // 复制完整卡片信息
      async function copyCardInfo(cardId) {
        try {
          showLoading();
          // 获取卡片详细信息
          const response = await fetch(`/api/cards/public/${cardId}`);
          const card = await response.json();

          if (!response.ok) {
            showToast("获取卡片信息失败", "error");
            return;
          }

          // 检查卡片是否已激活
          if (!card.is_activated || !card.card_number) {
            showToast("卡片尚未激活，无法复制信息", "error");
            return;
          }

          // 解析地址信息
          const addr =
            (typeof card.legal_address === "string"
              ? JSON.parse(card.legal_address)
              : card.legal_address) || {};

          // 格式化卡片信息
          const cardInfo = `卡号: ${card.card_number}
有效期: ${card.card_exp_date || "未知"}
安全码/CVC: ${card.card_cvc || "未知"}
姓名: ${generateRandomName()}
国家: ${addr.country || "US"}
地址第一行: ${addr.address1 || card.billing_address || "41 Glenn Rd C23"}
城市: ${addr.city || "East Hartford"}
州: ${addr.region || "CT"}
邮编: ${addr.postal_code || "06118"}`;

          // 显示在模态框中供用户复制
          // 这是解决移动端 async 函数中无法调用剪贴板 API 的关键
          showCopyModal(cardInfo);
        } catch (error) {
          console.log(error, "===error");
          showToast("复制失败: " + error.message, "error");
        } finally {
          hideLoading();
        }
      }

      // ==================== Card List ====================
      async function loadCardList() {
        if (!AuthManager.isAuthenticated() || AuthManager.isGuestMode()) {
          showToast("请先登录以查看卡片列表", "error");
          return;
        }

        const search = document.getElementById("cardSearch")?.value || "";
        const status = document.getElementById("cardStatusFilter")?.value || "";
        const soldFilter =
          document.getElementById("cardSoldFilter")?.value || "";
        const limitFilter = document.getElementById("limitFilter")?.value || "";
        const container = document.getElementById("cardListContainer");

        showLoading();

        try {
          // 构建查询参数 - 所有筛选由后端完成
          const params = new URLSearchParams();
          params.append("limit", "100");

          // 搜索参数
          if (search) params.append("search", search);

          // 状态筛选
          if (status) {
            params.append("status", status);
          } else {
            // 如果没有选择状态筛选,默认排除已删除的卡片
            params.append("exclude_deleted", "true");
          }

          // 售卖状态筛选
          if (soldFilter === "sold") {
            params.append("is_sold", "true");
          } else if (soldFilter === "unsold") {
            params.append("is_sold", "false");
          }

          // 额度筛选
          if (limitFilter) {
            const limitValue = parseFloat(limitFilter);
            if (!isNaN(limitValue)) {
              params.append("card_limit", limitValue);
            }
          }

          const url = `/api/cards/?${params.toString()}`;
          const response = await fetch(url, {
            headers: {
              Authorization: "Bearer " + AuthManager.getToken(),
            },
          });

          if (!response.ok) {
            if (response.status === 401) {
              showToast("登录已过期，请重新登录", "error");
              handleLogout();
              return;
            }
            throw new Error("加载失败");
          }

          let data = await response.json();
          // 新的API返回格式: { items: [], total: 0, skip: 0, limit: 100 }
          let cards = data.items || data; // 兼容新旧格式

                  </svg>
                  <p style="font-weight: 600;">暂无卡片</p>
                </div>

          let html = "";
          cards.forEach((card) => {
            html += `
              <div class="card fade-in" style="margin-bottom: 0.75rem;">
                <!-- 第一行: 复选框 + 卡密 -->
                <div style="display: flex; align-items: start; gap: 0.75rem;">

                    <div 
                      style="font-weight: 700; color: #111827; font-size: 0.875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;"
                      title="${card.card_id}"

                    >

                    </div>
                  </div>
                </div>
                
                <!-- 第二行: 卡号 + 状态 -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding-left: 2rem;">
                  <div style="font-size: 0.75rem; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">

                  <div style="flex-shrink: 0; margin-left: 0.5rem;">

                  <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">

                    <span style="font-weight: 600; color: #111827;">$${

                  </div>

                    <span style="color: #6b7280;">有效期:</span>
                    <span style="font-weight: 600; color: #111827;">${card.card_exp_date}</span>

                加载失败: ${error.message}
              </div>
            </div>
          `;

        } finally {
          hideLoading();
        }

      // ==================== Batch Selection ====================
      function toggleSelectAll() {
        const selectAllCheckbox = document.getElementById("selectAllCards");
        const cardCheckboxes = document.querySelectorAll(".card-checkbox");

        cardCheckboxes.forEach((checkbox) => {
          checkbox.checked = selectAllCheckbox.checked;
        });

        updateSelectedCount();
      }

      function updateSelectedCount() {
        const cardCheckboxes = document.querySelectorAll(".card-checkbox");
        const selectedCheckboxes = document.querySelectorAll(
          ".card-checkbox:checked"
        );
        const selectedCount = selectedCheckboxes.length;

        // 更新选中计数
        document.getElementById("selectedCount").textContent = selectedCount;

        // 更新全选复选框状态
        const selectAllCheckbox = document.getElementById("selectAllCards");
        if (selectedCount === 0) {
          selectAllCheckbox.checked = false;
          selectAllCheckbox.indeterminate = false;
        } else if (selectedCount === cardCheckboxes.length) {
          selectAllCheckbox.checked = true;
          selectAllCheckbox.indeterminate = false;
        } else {
          selectAllCheckbox.checked = false;
          selectAllCheckbox.indeterminate = true;
        }

        // 更新批量复制按钮状态
        const batchCopyBtn = document.getElementById("batchCopyBtn");
        const batchMarkSoldBtn = document.getElementById("batchMarkSoldBtn");

        if (selectedCount > 0) {
          batchCopyBtn.disabled = false;
          batchCopyBtn.style.opacity = "1";
          batchCopyBtn.style.cursor = "pointer";

          batchMarkSoldBtn.disabled = false;
          batchMarkSoldBtn.style.opacity = "1";
          batchMarkSoldBtn.style.cursor = "pointer";
        } else {
          batchCopyBtn.disabled = true;
          batchCopyBtn.style.opacity = "0.5";
          batchCopyBtn.style.cursor = "not-allowed";

          batchMarkSoldBtn.disabled = true;
          batchMarkSoldBtn.style.opacity = "0.5";
          batchMarkSoldBtn.style.cursor = "not-allowed";
        }
      }

      function batchCopyCardIds() {
        const selectedCheckboxes = document.querySelectorAll(
          ".card-checkbox:checked"
        );

        if (selectedCheckboxes.length === 0) {
          showToast("请先选择要复制的卡片", "error");
          return;
        }

        // 收集所有选中的卡密
        const cardIds = Array.from(selectedCheckboxes).map((checkbox) =>
          checkbox.getAttribute("data-card-id")
        );

        // 将卡密用换行符连接
        const cardIdsText = cardIds.join("\n");

        // 复制到剪贴板
        manualCopy(cardIdsText);
        showToast(`已复制 ${cardIds.length} 个卡密到剪贴板`, "success");

        // 取消所有选中
        selectedCheckboxes.forEach((checkbox) => {
          checkbox.checked = false;
        });
        updateSelectedCount();
      }

      // ==================== Batch Mark As Sold ====================
      async function batchMarkAsSold() {
        const selectedCheckboxes = document.querySelectorAll(
          ".card-checkbox:checked"
        );

        if (selectedCheckboxes.length === 0) {
          showToast("请先选择要标记的卡片", "error");
          return;
        }

        // 收集所有选中的卡密
        const cardIds = Array.from(selectedCheckboxes).map((checkbox) =>
          checkbox.getAttribute("data-card-id")
        );

        // 确认操作
        if (!confirm(`确定要将 ${cardIds.length} 张卡片标记为已售卖吗？`)) {
          return;
        }

        showLoading();

        let successCount = 0;
        let failCount = 0;

        try {
          // 批量标记售卖
          for (const cardId of cardIds) {
            try {
              const response = await fetch(`/api/cards/${cardId}/mark-sold`, {
                method: "POST",
                headers: {
                  Authorization: "Bearer " + AuthManager.getToken(),
                },
              });

              if (response.ok) {
                successCount++;
              } else {
                failCount++;
              }
            } catch (error) {
              failCount++;
            }
          }

          // 显示结果
          showToast(
            `成功标记 ${successCount} 张，失败 ${failCount} 张`,
            successCount > 0 ? "success" : "error"
          );

          // 取消所有选中
          selectedCheckboxes.forEach((checkbox) => {
            checkbox.checked = false;
          });
          updateSelectedCount();

          // 刷新列表
          if (successCount > 0) {
            setTimeout(() => {
              loadCardList();
            }, 1000);
          }
        } catch (error) {
          showToast("批量标记失败: " + error.message, "error");
        } finally {
          hideLoading();
        }
      }

      // ==================== Initialize ====================
      document.addEventListener("DOMContentLoaded", function () {
        // Prevent zoom on input focus (iOS)
        document.querySelectorAll("input, textarea").forEach((element) => {
          element.addEventListener("focus", function () {
            this.style.fontSize = "16px";
          });
        });

        // Check login status
        if (AuthManager.isAuthenticated()) {
          showMainApp("用户");
        } else if (AuthManager.isGuestMode()) {
          showMainApp(null);
        }
      });
    </script>
  </body>
</html>
